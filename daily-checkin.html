<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f3a5f">
<title>Daily Check-in</title>
<style>
:root{
  color-scheme: light;
  --bg:#eceff3; --surface:#fbfcfd; --surface2:#e4e9ef; --ink:#16212e; --muted:#5f6d7e; --line:#d5dce5;
  --accent:#1f3a5f; --accent-ink:#ffffff;
  --clean:#1c7560; --clean-bg:#d3ebe3;
  --stum:#9a6914; --stum-bg:#f3e3bf;
  --fell:#a23f30; --fell-bg:#f2d6d0;
  --info:#3f5f86; --info-bg:#dbe5f1;
  --none:#dfe4ea;
  --serif:"Charter","Bitstream Charter","Sitka Text",Cambria,"Iowan Old Style",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0e1621; --surface:#162131; --surface2:#1e2b3d; --ink:#e6ecf4; --muted:#92a1b4; --line:#273548;
    --accent:#8db3e6; --accent-ink:#0b1220;
    --clean:#5fcaa9; --clean-bg:#173a31;
    --stum:#e3ad52; --stum-bg:#3b2f17;
    --fell:#ec8272; --fell-bg:#43221f;
    --info:#94b3d8; --info-bg:#1f3045;
    --none:#1f2c3d;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:14px 16px 150px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.top h1{font-family:var(--serif);font-size:22px;margin:0;font-weight:600;letter-spacing:.1px}
.top .sub{font-size:13px;color:var(--muted)}
.btn-sm{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav .in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:transparent;padding:14px 4px 13px;font-size:14px;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
.nav button.on{color:var(--accent);font-weight:600;border-top-color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin:0 0 14px}
.card.pad{padding:16px}
.card h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:2px 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datebar .dt{text-align:center;position:relative;flex:1}
.datebar .dt strong{font-family:var(--serif);font-size:19px;font-weight:600;display:block}
.datebar .dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--ink)}
.icon:disabled{opacity:.35;cursor:default}

/* status pill */
.pill{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.pill i{width:12px;height:12px;border-radius:50%;background:currentColor;flex:none}
.pill.none{background:var(--surface2);color:var(--muted)}
.pill.clean{background:var(--clean-bg);color:var(--clean)}
.pill.stumbled{background:var(--stum-bg);color:var(--stum)}
.pill.fell{background:var(--fell-bg);color:var(--fell)}

/* questions */
.q{border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.kids .q{border-bottom:0}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.ql{font-size:15.5px}
.kids{margin:0 0 8px 4px;padding-left:12px;border-left:2px solid var(--line);animation:open .18s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.kids .ql{font-size:15px}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;color:var(--muted);min-width:54px;min-height:40px;padding:0 14px;font-size:14.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.no{background:var(--clean-bg);color:var(--clean);font-weight:600}
.seg.lvl-info button.on.yes{background:var(--info-bg);color:var(--info);font-weight:600}
.seg.lvl-warn button.on.yes{background:var(--stum-bg);color:var(--stum);font-weight:600}
.seg.lvl-act button.on.yes{background:var(--fell-bg);color:var(--fell);font-weight:600}
.seg.good button.on.yes{background:var(--clean-bg);color:var(--clean);font-weight:600}
.seg.good button.on.no{background:var(--surface);color:var(--muted);font-weight:600}
.seg.plain button.on.yes,.seg.plain button.on.no{background:var(--info-bg);color:var(--info);font-weight:600}

/* extras */
.field{padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label.t{display:block;font-size:15.5px;margin-bottom:6px}
.urge{display:flex;align-items:center;gap:12px}
.urge input{flex:1;accent-color:var(--accent)}
.urge output{min-width:28px;text-align:right;font-family:var(--serif);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.chipb.on{background:var(--info-bg);border-color:var(--info);color:var(--info);font-weight:600}
textarea{width:100%;min-height:84px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;resize:vertical}

/* actions */
.actions{position:sticky;bottom:66px;display:flex;gap:10px;padding:10px 0;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 18px;font-weight:600;min-height:48px}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{color:var(--muted);font-weight:500}
.btn.danger{background:var(--fell);border-color:var(--fell);color:#fff}
.btn.block{width:100%}

/* month calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 4px}
.cal button,.cal .e{aspect-ratio:1;border-radius:10px;border:0;font-size:14px;position:relative;display:grid;place-items:center;background:transparent}
.cal button.clean{background:var(--clean-bg);color:var(--clean);font-weight:600}
.cal button.stumbled{background:var(--stum-bg);color:var(--stum);font-weight:600}
.cal button.fell{background:var(--fell-bg);color:var(--fell);font-weight:600}
.cal button.unl{border:1px dashed var(--line);color:var(--muted)}
.cal button.pre,.cal button.fut{color:var(--muted);opacity:.4}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button.res::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend .c{background:var(--clean-bg);box-shadow:inset 0 0 0 1.5px var(--clean)}
.legend .s{background:var(--stum-bg);box-shadow:inset 0 0 0 1.5px var(--stum)}
.legend .f{background:var(--fell-bg);box-shadow:inset 0 0 0 1.5px var(--fell)}
.legend .u{border:1px dashed var(--muted)}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1.1;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}
.stat.c b{color:var(--clean)} .stat.s b{color:var(--stum)} .stat.f b{color:var(--fell)}
.monthhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthhead .mt{text-align:center;flex:1}
.monthhead strong{font-family:var(--serif);font-size:20px;font-weight:600;display:block}
.sectiontitle{font-family:var(--serif);font-size:18px;font-weight:600;margin:22px 2px 10px}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--none)}
.stack i{display:block;min-width:0}
.stack .c{background:var(--clean)} .stack .s{background:var(--stum)} .stack .f{background:var(--fell)} .stack .u{background:var(--none)}
.mrow{padding:11px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .l{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:7px}
.ctable .crow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.ctable .crow:last-child{border-bottom:0}
.n{font-family:var(--serif);font-size:18px;min-width:28px;text-align:right}
.n.z{color:var(--muted);font-weight:400}
.n.lvl-act:not(.z){color:var(--fell)} .n.lvl-warn:not(.z){color:var(--stum)} .n.lvl-info:not(.z){color:var(--info)}
.bar{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.bar .w{width:36px;color:var(--muted)}
.bar .t{flex:1;height:10px;background:var(--none);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--stum);border-radius:6px}
.bar .v{width:26px;text-align:right}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.strip i{width:13px;height:13px;border-radius:3px;background:var(--none)}
.strip i.clean{background:var(--clean)} .strip i.stumbled{background:var(--stum)} .strip i.fell{background:var(--fell)} .strip i.unl{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

/* streak chip (the one memorable element) */
.hero{display:flex;align-items:center;gap:20px;padding:18px 16px}
.chip{--tier:#7b8aa0;flex:none;width:136px;height:136px;border-radius:50%;padding:7px;background:var(--tier);
  background:conic-gradient(from 20deg,var(--tier),color-mix(in srgb,var(--tier) 55%,var(--surface)),var(--tier),color-mix(in srgb,var(--tier) 55%,var(--surface)),var(--tier))}
.chip.t1{--tier:#1c7560} .chip.t2{--tier:#176a3f} .chip.t3{--tier:#b08a1e} .chip.t4{--tier:#1f3a5f}
@media (prefers-color-scheme: dark){ .chip{--tier:#6b7a90} .chip.t1{--tier:#3fae8f} .chip.t2{--tier:#4fbf6f} .chip.t3{--tier:#e1b84a} .chip.t4{--tier:#8db3e6} }
.chip-in{width:100%;height:100%;border-radius:50%;background:var(--surface);display:grid;place-content:center;text-align:center;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4.5px var(--tier)}
.chip-in b{font-family:var(--serif);font-size:46px;line-height:1;font-weight:600}
.chip-in span{font-size:13px;color:var(--muted);margin-top:2px}
.hero .txt .big{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 4px}
.hero .txt p{margin:0 0 4px;font-size:14px;color:var(--muted)}

/* settings */
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .d{font-size:13px;color:var(--muted);margin-top:2px}
.inp{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}

/* overlays */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);max-width:calc(100% - 32px);width:440px;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:14px;z-index:60;font-size:14.5px;animation:open .2s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(10,16,26,.55);display:grid;place-items:center;padding:20px;z-index:80}
.modal .box{background:var(--surface);border-radius:16px;padding:20px;max-width:380px;width:100%}
.modal p{margin:0 0 16px}
.lock{min-height:100vh;display:grid;place-items:center;padding:20px}
.lock form{width:100%;max-width:320px;text-align:center}
.lock h2{font-family:var(--serif);font-weight:600;margin:0 0 16px}
.lock .inp{text-align:center;font-size:22px;letter-spacing:6px;margin-bottom:12px}
.err{color:var(--fell);min-height:22px;font-size:14px;margin:8px 0 0}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- Question tree ---------- */
/* lvl: info = exposure, warn = stumble step, act = a fall */
const SCHEMA=[
  {k:'tel',l:'Phone call received',lvl:'info',c:[
    {k:'tel_conv',l:'Converse',lvl:'warn'}]},
  {k:'sms',l:'SMS received',lvl:'info',c:[
    {k:'sms_conv',l:'Converse',lvl:'warn'}]},
  {k:'trig',l:'Trigger',lvl:'info',c:[
    {k:'stum',l:'Stumbled',lvl:'warn',c:[
      {k:'stum_porn',l:'Watched porn',lvl:'act'},
      {k:'stum_mast',l:'Masturbated',lvl:'act'},
      {k:'search',l:'Searched function',lvl:'warn',c:[
        {k:'incog',l:'Incognito',lvl:'warn'},
        {k:'popup',l:'Pop-ups',lvl:'warn',c:[
          {k:'resp',l:'Responded',lvl:'warn',c:[
            {k:'resp_porn',l:'Porn',lvl:'act'},
            {k:'resp_mast',l:'Masturbated',lvl:'act'}]}]}]}]}]},
  {k:'bad',l:'Bad thoughts',lvl:'info',c:[
    {k:'bad_porn',l:'Porn',lvl:'act'},
    {k:'bad_mast',l:'Masturbated',lvl:'act'}]},
  {k:'mast',l:'Masturbated',lvl:'act'},
  {k:'forn',l:'Fornicated',lvl:'act'}
];
const HALT=['Hungry','Angry','Lonely','Tired','Bored','Stressed'];
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MILESTONES=[1,3,7,14,30,60,90,180,365,500,730,1000];

const FLAT=[],PARENT={};
(function walk(list,depth,parent){list.forEach(q=>{FLAT.push({k:q.k,l:q.l,lvl:q.lvl,depth});PARENT[q.k]=parent;if(q.c)walk(q.c,depth+1,q.k);});})(SCHEMA,0,null);
const ACTS=FLAT.filter(q=>q.lvl==='act').map(q=>q.k);

/* ---------- Dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const today=()=>fmt(new Date());
function* eachDay(from,to){let d=from;while(d<=to){yield d;d=addDays(d,1);}}
const longDate=s=>parse(s).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const shortDate=s=>parse(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const monthName=ym=>parse(ym+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'});
const pct=(a,b)=>b?Math.round(a/b*100):0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- State & storage ---------- */
const KEY='daily-checkin-v1';
let S=null,tab='today',viewDate=today(),viewMonth=today().slice(0,7),locked=false,storageMode='memory',saveTimer=null;

const blankEntry=()=>({a:{},urge:null,halt:[],prayer:false,checkin:false,late:false,notes:''});
function normalize(o){
  const d={v:1,settings:{start:null,stumbleBreaks:true,converseIsStumble:false,pin:null},entries:{}};
  if(!o||typeof o!=='object')return d;
  Object.assign(d.settings,o.settings||{});
  Object.keys(o.entries||{}).forEach(k=>{
    const e=o.entries[k]||{};
    d.entries[k]={a:e.a||{},urge:(e.urge===undefined?null:e.urge),halt:Array.isArray(e.halt)?e.halt:[],prayer:!!e.prayer,checkin:!!e.checkin,late:!!e.late,notes:e.notes||''};
  });
  return d;
}
async function loadState(){
  if(window.storage){
    storageMode='artifact';
    try{const r=await window.storage.get(KEY,false);if(r&&r.value)return JSON.parse(r.value);}catch(e){}
    return null;
  }
  try{
    localStorage.setItem('__t','1');localStorage.removeItem('__t');
    storageMode='local';
    const v=localStorage.getItem(KEY);
    return v?JSON.parse(v):null;
  }catch(e){storageMode='memory';return null;}
}
async function persist(){
  const txt=JSON.stringify(S);
  try{
    if(storageMode==='artifact')await window.storage.set(KEY,txt,false);
    else if(storageMode==='local')localStorage.setItem(KEY,txt);
  }catch(e){console.error('Save failed',e);}
}
function persistSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,350);}

/* ---------- Logic ---------- */
function eff(a,k){
  if(a[k]!==true)return false;
  const p=PARENT[k];
  return p?eff(a,p):true;
}
function status(e){
  if(!e)return null;
  if(ACTS.some(k=>eff(e.a,k)))return 'fell';
  if(eff(e.a,'stum'))return 'stumbled';
  if(S.settings.converseIsStumble&&(eff(e.a,'tel_conv')||eff(e.a,'sms_conv')))return 'stumbled';
  return 'clean';
}
const okStatus=s=>s==='clean'||(s==='stumbled'&&!S.settings.stumbleBreaks);
const resisted=e=>status(e)==='clean'&&(eff(e.a,'trig')||eff(e.a,'bad'));
function effStart(){
  if(S.settings.start)return S.settings.start;
  const ks=Object.keys(S.entries).sort();
  return ks.length?ks[0]:today();
}
function streaks(){
  const start=effStart(),t=today();
  let cur=0,d=t;
  if(!S.entries[d])d=addDays(d,-1);
  while(d>=start&&S.entries[d]&&okStatus(status(S.entries[d]))){cur++;d=addDays(d,-1);}
  let best=0,run=0,lastFall=null;
  for(const x of eachDay(start,t)){
    const e=S.entries[x];
    if(e&&okStatus(status(e))){run++;if(run>best)best=run;}else run=0;
    if(e&&status(e)==='fell')lastFall=x;
  }
  return {cur,best,lastFall};
}
function rangeStats(from,to){
  const s={days:0,logged:0,clean:0,stumbled:0,fell:0,resisted:0,counts:{},halt:{},wd:[0,0,0,0,0,0,0],prayer:0,checkin:0,late:0,urgeSum:0,urgeN:0};
  FLAT.forEach(q=>{s.counts[q.k]=0;});
  for(const d of eachDay(from,to)){
    s.days++;
    const e=S.entries[d];if(!e)continue;
    s.logged++;
    const st=status(e);s[st]++;
    FLAT.forEach(q=>{if(eff(e.a,q.k))s.counts[q.k]++;});
    if(resisted(e))s.resisted++;
    e.halt.forEach(h=>{s.halt[h]=(s.halt[h]||0)+1;});
    if(st!=='clean')s.wd[(parse(d).getDay()+6)%7]++;
    if(e.prayer)s.prayer++;if(e.checkin)s.checkin++;if(e.late)s.late++;
    if(typeof e.urge==='number'){s.urgeSum+=e.urge;s.urgeN++;}
  }
  s.unlogged=s.days-s.logged;
  return s;
}
function monthRange(ym){
  const p=ym.split('-').map(Number);
  const first=ym+'-01',last=ym+'-'+pad(new Date(p[0],p[1],0).getDate());
  const from=first<effStart()?effStart():first;
  const t=today();
  const to=last>t?t:last;
  return {first,last,from,to};
}
function monthsBetween(start,end){
  const out=[];let p=start.slice(0,7).split('-').map(Number);const q=end.slice(0,7).split('-').map(Number);
  let y=p[0],m=p[1];
  while(y<q[0]||(y===q[0]&&m<=q[1])){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++;}}
  return out;
}
function clearDescendants(a,k){
  FLAT.forEach(q=>{let p=PARENT[q.k];while(p){if(p===k){delete a[q.k];break;}p=PARENT[p];}});
}
function getEditable(){
  if(!S.entries[viewDate]){
    S.entries[viewDate]=blankEntry();
    if(!S.settings.start||viewDate<S.settings.start)S.settings.start=viewDate;
  }
  return S.entries[viewDate];
}

/* ---------- Render helpers ---------- */
function seg(k,val,lvl,cls,act,noLabel,yesLabel){
  return '<div class="seg '+(cls||'lvl-'+lvl)+'">'+
    '<button class="'+(val!==true?'on no':'')+'" data-act="'+act+'" data-k="'+k+'" data-v="0">'+(noLabel||'No')+'</button>'+
    '<button class="'+(val===true?'on yes':'')+'" data-act="'+act+'" data-k="'+k+'" data-v="1">'+(yesLabel||'Yes')+'</button></div>';
}
function qRow(q,a){
  const on=a[q.k]===true;
  return '<div class="q"><div class="qrow"><span class="ql">'+esc(q.l)+'</span>'+seg(q.k,a[q.k],q.lvl,'','set')+'</div>'+
    (on&&q.c?'<div class="kids">'+q.c.map(c=>qRow(c,a)).join('')+'</div>':'')+'</div>';
}
function pillHtml(e){
  const st=status(e);
  const map={clean:'Clean day',stumbled:'Stumbled, no fall',fell:'Fell'};
  if(!st)return '<div class="pill none" id="pill"><i></i>Not logged yet</div>';
  let extra='';
  if(st==='clean'&&resisted(e))extra=' – temptation resisted';
  return '<div class="pill '+st+'" id="pill"><i></i>'+map[st]+extra+'</div>';
}
function stack(s){
  return '<div class="stack"><i class="c" style="flex:'+s.clean+'"></i><i class="s" style="flex:'+s.stumbled+'"></i><i class="f" style="flex:'+s.fell+'"></i><i class="u" style="flex:'+s.unlogged+'"></i></div>';
}
function countsTable(s){
  return '<div class="ctable">'+FLAT.map(q=>{
    const n=s.counts[q.k];
    return '<div class="crow" style="padding-left:'+(q.depth*16)+'px"><span>'+esc(q.l)+'</span><b class="n lvl-'+q.lvl+(n?'':' z')+'">'+n+'</b></div>';
  }).join('')+'</div>';
}
function stat(label,val,cls){return '<div class="stat '+(cls||'')+'"><b>'+val+'</b><span>'+label+'</span></div>';}
function streakHeader(){
  const st=streaks();
  return '<header class="top"><div><h1>Daily Check-in</h1><div class="sub">'+(st.cur===1?'1-day streak':st.cur+'-day streak')+'</div></div>'+
    (S.settings.pin?'<button class="btn-sm" data-act="lock">Lock</button>':'')+'</header>';
}

/* ---------- Views ---------- */
function viewToday(){
  const e=S.entries[viewDate];
  const d=e||blankEntry();
  const isT=viewDate===today();
  const ago=diffDays(viewDate,today());
  const rel=isT?'Today':(ago===1?'Yesterday':ago+' days ago');
  return streakHeader()+
  '<section class="datebar">'+
    '<button class="icon" data-act="day" data-v="-1" aria-label="Previous day">&#8249;</button>'+
    '<div class="dt"><strong>'+esc(longDate(viewDate))+'</strong><span class="small muted">'+rel+' (tap to pick a date)</span>'+
    '<input type="date" id="dpick" value="'+viewDate+'" max="'+today()+'" aria-label="Pick a date"></div>'+
    '<button class="icon" data-act="day" data-v="1" aria-label="Next day" '+(isT?'disabled':'')+'>&#8250;</button>'+
  '</section>'+
  pillHtml(e)+
  '<div class="card">'+SCHEMA.map(q=>qRow(q,d.a)).join('')+'</div>'+
  '<div class="card">'+
    '<div class="field"><label class="t" for="urge">Strongest urge today</label><div class="urge"><input type="range" id="urge" min="0" max="10" step="1" value="'+(d.urge===null?0:d.urge)+'"><output id="urgeOut">'+(d.urge===null?'–':d.urge)+'</output></div></div>'+
    '<div class="field"><label class="t">What lined up with it?</label><div class="chips">'+HALT.map(h=>'<button class="chipb '+(d.halt.indexOf(h)>-1?'on':'')+'" data-act="halt" data-k="'+h+'">'+h+'</button>').join('')+'</div></div>'+
    '<div class="field qrow"><span class="ql">Late night or alone with my phone</span>'+seg('late',d.late,'warn','','flag')+'</div>'+
    '<div class="field qrow"><span class="ql">Prayed / read Scripture</span>'+seg('prayer',d.prayer,'','good','flag')+'</div>'+
    '<div class="field qrow"><span class="ql">Checked in with accountability partner</span>'+seg('checkin',d.checkin,'','good','flag')+'</div>'+
  '</div>'+
  '<div class="card pad"><label class="t small muted" for="notes">Notes</label><textarea id="notes" placeholder="What happened, what helped, what to do differently">'+esc(d.notes)+'</textarea></div>'+
  '<div class="actions">'+(e?'<button class="btn ghost" data-act="clear">Clear day</button>':'')+'<button class="btn primary" data-act="save">Save day</button></div>';
}

function viewMonth(){
  const t=today(),start=effStart();
  const r=monthRange(viewMonth);
  const p=viewMonth.split('-').map(Number);
  const dim=new Date(p[0],p[1],0).getDate();
  const lead=(parse(r.first).getDay()+6)%7;
  const s=r.from<=r.to?rangeStats(r.from,r.to):rangeStats('2000-01-02','2000-01-01');
  const isCur=viewMonth===t.slice(0,7);
  let cells=WD.map(w=>'<div class="h">'+w+'</div>').join('');
  for(let i=0;i<lead;i++)cells+='<div class="e"></div>';
  for(let d=1;d<=dim;d++){
    const ds=viewMonth+'-'+pad(d);
    const e=S.entries[ds],st=e?status(e):null,fut=ds>t;
    let cls=fut?'fut':(st?st:(ds>=start?'unl':'pre'));
    if(ds===t)cls+=' today';
    if(e&&resisted(e))cls+=' res';
    cells+='<button class="'+cls+'" data-act="goto" data-v="'+ds+'" '+(fut?'disabled':'')+'>'+d+'</button>';
  }
  const sub=isCur?('Month to date: '+parse(r.from).getDate()+'–'+parse(r.to).getDate()+' '+parse(r.to).toLocaleDateString(undefined,{month:'short'})):
    (s.days?'Full month':'Before your start date');
  return streakHeader()+
  '<div class="monthhead"><button class="icon" data-act="mon" data-v="-1" aria-label="Previous month">&#8249;</button>'+
  '<div class="mt"><strong>'+esc(monthName(viewMonth))+'</strong><span class="small muted">'+sub+'</span></div>'+
  '<button class="icon" data-act="mon" data-v="1" aria-label="Next month" '+(isCur?'disabled':'')+'>&#8250;</button></div>'+
  '<div class="card pad"><div class="cal">'+cells+'</div>'+
    '<div class="legend"><span><i class="c"></i>Clean</span><span><i class="s"></i>Stumbled</span><span><i class="f"></i>Fell</span><span><i class="u"></i>Not logged</span><span>Dot = tempted, resisted</span></div></div>'+
  '<div class="grid3">'+stat('Clean days',s.clean+' / '+s.logged,'c')+stat('Stumbled',s.stumbled,'s')+stat('Falls',s.fell,'f')+'</div>'+
  '<div class="grid3" style="margin-top:10px">'+stat('Clean rate',pct(s.clean,s.logged)+'%')+stat('Resisted',s.resisted)+stat('Not logged',s.unlogged)+'</div>'+
  '<div class="sectiontitle">Days it came up this month</div>'+
  '<div class="card">'+countsTable(s)+'</div>'+
  habitsCard(s);
}

function habitsCard(s){
  if(!s.logged)return '';
  const halts=Object.keys(s.halt).sort((a,b)=>s.halt[b]-s.halt[a]);
  return '<div class="sectiontitle">Patterns</div><div class="card">'+
    '<div class="crow ctable" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>Prayer / Scripture days</span><b class="n">'+s.prayer+' / '+s.logged+'</b></div>'+
    '<div class="crow ctable" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>Accountability check-ins</span><b class="n">'+s.checkin+' / '+s.logged+'</b></div>'+
    '<div class="crow ctable" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>Late night or alone with phone</span><b class="n">'+s.late+' / '+s.logged+'</b></div>'+
    '<div class="crow ctable" style="display:flex;justify-content:space-between;padding:8px 0;'+(halts.length?'border-bottom:1px solid var(--line)':'')+'"><span>Average strongest urge</span><b class="n">'+(s.urgeN?(s.urgeSum/s.urgeN).toFixed(1):'–')+'</b></div>'+
    (halts.length?'<div style="padding:10px 0 6px"><div class="small muted" style="margin-bottom:8px">Most common conditions</div><div class="chips">'+halts.map(h=>'<span class="chipb on">'+h+' '+s.halt[h]+'</span>').join('')+'</div></div>':'')+
  '</div>';
}

function viewTotal(){
  const t=today(),start=effStart();
  const st=streaks();
  const s=rangeStats(start,t);
  const tier=st.cur>=365?4:st.cur>=90?3:st.cur>=30?2:st.cur>=7?1:0;
  const next=MILESTONES.find(m=>m>st.cur);
  const sinceFall=st.lastFall?diffDays(st.lastFall,t):null;
  const months=monthsBetween(start,t).reverse();
  const maxWd=Math.max.apply(null,s.wd.concat([1]));
  const startedAny=Object.keys(S.entries).length>0;
  const stripDays=[];for(const d of eachDay(start,t))stripDays.push(d);
  const shown=stripDays.slice(-365);
  return streakHeader()+
  '<div class="card hero"><div class="chip t'+tier+'"><div class="chip-in"><b>'+st.cur+'</b><span>'+(st.cur===1?'day clean':'days clean')+'</span></div></div>'+
  '<div class="txt"><p class="big">'+(startedAny?'Since '+esc(shortDate(start)):'Not started yet')+'</p>'+
  '<p>Best streak: '+st.best+' '+(st.best===1?'day':'days')+'</p>'+
  '<p>'+(st.lastFall?'Last fall: '+esc(shortDate(st.lastFall))+' ('+sinceFall+' '+(sinceFall===1?'day':'days')+' ago)':(startedAny?'No falls logged':'Log your first day to begin'))+'</p>'+
  (next?'<p>Next milestone: '+next+' days ('+(next-st.cur)+' to go)</p>':'')+'</div></div>'+
  '<div class="grid3">'+stat('Days since start',s.days)+stat('Logged',s.logged)+stat('Not logged',s.unlogged)+'</div>'+
  '<div class="grid3" style="margin-top:10px">'+stat('Clean days',s.clean,'c')+stat('Stumbled',s.stumbled,'s')+stat('Falls',s.fell,'f')+'</div>'+
  '<div class="grid2" style="margin-top:10px">'+stat('Clean rate (logged days)',pct(s.clean,s.logged)+'%')+stat('Temptations resisted',s.resisted)+'</div>'+
  '<div class="sectiontitle">Month by month</div><div class="card">'+
  months.map(ym=>{
    const r=monthRange(ym);const ms=r.from<=r.to?rangeStats(r.from,r.to):null;
    if(!ms)return '';
    return '<div class="mrow"><div class="l"><span>'+esc(monthName(ym))+'</span><span class="muted">'+ms.clean+' clean, '+ms.stumbled+' stumbled, '+ms.fell+' fell ('+pct(ms.clean,ms.logged)+'%)</span></div>'+stack(ms)+'</div>';
  }).join('')+'</div>'+
  '<div class="sectiontitle">Every day since the start</div><div class="card pad"><div class="strip">'+
    shown.map(d=>{const e=S.entries[d];return '<i class="'+(e?status(e):'unl')+'" title="'+d+'"></i>';}).join('')+'</div>'+
    (stripDays.length>365?'<div class="small muted" style="margin-top:8px">Showing the last 365 days.</div>':'')+'</div>'+
  '<div class="sectiontitle">Days it came up since the start</div><div class="card">'+countsTable(s)+'</div>'+
  '<div class="sectiontitle">Hardest days of the week</div><div class="card pad">'+
    WD.map((w,i)=>'<div class="bar"><span class="w">'+w+'</span><span class="t"><i style="width:'+Math.round(s.wd[i]/maxWd*100)+'%"></i></span><span class="v">'+s.wd[i]+'</span></div>').join('')+
    '<div class="small muted" style="margin-top:6px">Stumbled or fell days.</div></div>'+
  habitsCard(s);
}

function viewSettings(){
  const set=S.settings;
  const modeTxt={local:'Saved in this browser on this device.',artifact:'Saved in Claude storage for this artifact.',memory:'Storage is blocked here, so data is lost when you close the page. Open the file from your own device or host it, and back up often.'}[storageMode];
  return streakHeader()+
  '<div class="card">'+
    '<div class="srow"><div><div>Start date</div><div class="d">Day one of your count. Moves earlier automatically if you log an earlier day.</div></div></div>'+
    '<div class="srow"><input class="inp" type="date" id="startDate" value="'+effStart()+'" max="'+today()+'"></div>'+
    '<div class="srow"><div><div>A stumble breaks my streak</div><div class="d">Stumbled without a fall.</div></div>'+seg('stumbleBreaks',set.stumbleBreaks,'','plain','setting')+'</div>'+
    '<div class="srow"><div><div>Conversing counts as a stumble</div><div class="d">Taking or replying to a risky call or SMS.</div></div>'+seg('converseIsStumble',set.converseIsStumble,'','plain','setting')+'</div>'+
  '</div>'+
  '<div class="sectiontitle">Privacy lock</div><div class="card pad">'+
    '<p class="small muted" style="margin-top:0">A PIN hides the screen from casual viewing and locks when you switch apps. It does not encrypt the data.</p>'+
    (set.pin?'<button class="btn block" data-act="pinremove">Remove PIN</button>':
    '<div class="row"><input class="inp" id="pinNew" type="password" inputmode="numeric" placeholder="New PIN (4+ digits)" autocomplete="off" style="flex:2"><button class="btn" data-act="pinset">Set PIN</button></div>')+
    '<div class="err" id="pinErr"></div></div>'+
  '<div class="sectiontitle">Backup</div><div class="card pad">'+
    '<p class="small muted" style="margin-top:0">'+modeTxt+' Download a backup now and then, and use it to move to a new phone or browser.</p>'+
    '<div class="row"><button class="btn" data-act="export">Download backup</button><button class="btn" data-act="showtext">Show backup text</button></div>'+
    '<textarea id="bk" style="margin-top:12px" placeholder="Backup text appears here. Paste a backup here to restore."></textarea>'+
    '<div class="row" style="margin-top:10px"><button class="btn" data-act="restore">Restore from text</button><label class="btn" style="text-align:center;cursor:pointer">Restore from file<input type="file" id="bkfile" accept="application/json,.json" hidden></label></div></div>'+
  '<div class="card pad" style="margin-top:14px"><button class="btn danger block" data-act="reset">Erase all data</button></div>';
}

function viewLock(){
  return '<div class="lock"><form id="lockform" autocomplete="off"><h2>Daily Check-in</h2><input class="inp" id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="btn primary block" type="submit">Unlock</button><div class="err" id="lockErr"></div></form></div>';
}

const $app=document.getElementById('app');
function render(){
  if(!S){$app.innerHTML='';return;}
  if(locked){$app.innerHTML=viewLock();const p=document.getElementById('pin');if(p)p.focus();return;}
  let body='';
  if(tab==='today')body=viewToday();
  else if(tab==='month')body=viewMonth();
  else if(tab==='total')body=viewTotal();
  else body=viewSettings();
  const nav='<nav class="nav"><div class="in">'+[['today','Today'],['month','Month'],['total','Total'],['settings','Settings']].map(x=>'<button class="'+(tab===x[0]?'on':'')+'" data-act="tab" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></nav>';
  $app.innerHTML=body+nav;
}

/* ---------- UI helpers ---------- */
function toast(msg){
  const old=document.querySelector('.toast');if(old)old.remove();
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),4200);
}
function confirmBox(msg,ok){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='modal';
    o.innerHTML='<div class="box" role="dialog" aria-modal="true"><p>'+esc(msg)+'</p><div class="row"><button class="btn ghost" data-r="0">Cancel</button><button class="btn danger" data-r="1">'+esc(ok||'Confirm')+'</button></div></div>';
    o.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b||e.target===o){o.remove();res(b?b.dataset.r==='1':false);}});
    document.body.appendChild(o);
  });
}
async function hashPin(p){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('chk:'+p));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=5381;const s='chk:'+p;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+h;}
}
function exportJson(){return JSON.stringify(S,null,2);}
function downloadBackup(){
  const blob=new Blob([exportJson()],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='checkin-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function applyImport(text){
  let o;try{o=JSON.parse(text);}catch(e){toast('That is not a valid backup.');return;}
  if(!o||typeof o.entries!=='object'){toast('That is not a valid backup.');return;}
  const n=Object.keys(o.entries).length;
  if(await confirmBox('Replace everything here with this backup ('+n+' logged days)?','Replace')){
    S=normalize(o);await persist();viewDate=today();render();toast('Backup restored.');
  }
}
const GOOD=['Another day won. Well done.','Clean day logged. Keep going, one day at a time.','Faithful in the small things. Day saved.'];
function saveMessage(e){
  const st=status(e);
  if(st==='clean')return resisted(e)?'You were tempted and stood firm. Day saved.':GOOD[Math.floor(Math.random()*GOOD.length)];
  if(st==='stumbled')return 'You stopped short of a fall. Note what led here and close that gap tomorrow. Day saved.';
  return 'Logged honestly. Do not carry shame into tomorrow: tell your accountability partner and start again. Day saved.';
}

/* ---------- Events ---------- */
$app.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,k=t.dataset.k,v=t.dataset.v;
  if(act==='tab'){tab=v;render();window.scrollTo(0,0);return;}
  if(act==='lock'){locked=true;render();return;}
  if(act==='day'){const nd=addDays(viewDate,+v);if(nd<=today()){viewDate=nd;render();}return;}
  if(act==='mon'){
    const p=viewMonth.split('-').map(Number);let y=p[0],m=p[1]+(+v);
    if(m<1){m=12;y--;}if(m>12){m=1;y++;}
    const nm=y+'-'+pad(m);if(nm<=today().slice(0,7)){viewMonth=nm;render();}return;
  }
  if(act==='goto'){viewDate=v;tab='today';render();window.scrollTo(0,0);return;}
  if(act==='set'){
    const e=getEditable();e.a[k]=(v==='1');
    if(v!=='1')clearDescendants(e.a,k);
    persist();render();return;
  }
  if(act==='flag'){const e=getEditable();e[k]=(v==='1');persist();render();return;}
  if(act==='halt'){
    const e=getEditable();const i=e.halt.indexOf(k);
    if(i>-1)e.halt.splice(i,1);else e.halt.push(k);
    persist();render();return;
  }
  if(act==='save'){const e=getEditable();await persist();render();toast(saveMessage(e));return;}
  if(act==='clear'){
    if(await confirmBox('Clear everything logged for '+longDate(viewDate)+'?','Clear day')){
      delete S.entries[viewDate];await persist();render();
    }
    return;
  }
  if(act==='setting'){S.settings[k]=(v==='1');await persist();render();return;}
  if(act==='pinset'){
    const val=(document.getElementById('pinNew').value||'').trim();
    if(!/^\d{4,}$/.test(val)){document.getElementById('pinErr').textContent='Use at least 4 digits.';return;}
    S.settings.pin=await hashPin(val);await persist();render();toast('PIN set.');return;
  }
  if(act==='pinremove'){
    if(await confirmBox('Remove the PIN lock?','Remove')){S.settings.pin=null;await persist();render();}
    return;
  }
  if(act==='export'){downloadBackup();return;}
  if(act==='showtext'){const b=document.getElementById('bk');b.value=exportJson();b.focus();b.select();try{document.execCommand('copy');toast('Backup text copied.');}catch(e){}return;}
  if(act==='restore'){const txt=document.getElementById('bk').value.trim();if(!txt){toast('Paste a backup first.');return;}applyImport(txt);return;}
  if(act==='reset'){
    if(await confirmBox('Erase every logged day and all settings? This cannot be undone.','Erase everything')){
      S=normalize(null);await persist();viewDate=today();render();toast('All data erased.');
    }
    return;
  }
});
$app.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='urge'){
    const e=getEditable();e.urge=+t.value;
    document.getElementById('urgeOut').textContent=t.value;persistSoon();
  }else if(t.id==='notes'){
    const e=getEditable();e.notes=t.value;persistSoon();
  }
});
$app.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='dpick'){if(t.value&&t.value<=today()){viewDate=t.value;render();}}
  else if(t.id==='startDate'){if(t.value&&t.value<=today()){S.settings.start=t.value;persist();render();}}
  else if(t.id==='bkfile'&&t.files&&t.files[0]){
    const f=t.files[0];const r=new FileReader();
    r.onload=()=>applyImport(String(r.result));r.readAsText(f);
  }
});
$app.addEventListener('submit',async ev=>{
  if(ev.target.id!=='lockform')return;
  ev.preventDefault();
  const val=document.getElementById('pin').value;
  if((await hashPin(val))===S.settings.pin){locked=false;render();}
  else{document.getElementById('lockErr').textContent='Wrong PIN.';document.getElementById('pin').value='';}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&S&&S.settings.pin&&!locked){locked=true;render();}
});

/* ---------- Start ---------- */
(async function init(){
  S=normalize(await loadState());
  if(S.settings.pin)locked=true;
  render();
})();
})();
</script>
</body>
</html>
